name: Release

# main에 푸시될 때마다 patch 버전을 올리고, Windows exe(nsis 설치본 = 자동 업데이트 대상 + portable)와
# Android APK를 빌드해 같은 GitHub Release에 첨부한다.
# electron-updater(데스크톱)는 이 Release를 보고 자동으로 새 버전을 감지/설치한다.
# 안드로이드는 사이드로드라 앱 내에서 "새 버전 있음" 배너만 띄우고, 설치는 사용자가 직접 진행한다.
#
# 릴리스는 draft로 만들어 두 빌드 잡이 에셋을 붙일 시간을 벌고, 둘 다 끝나면 finalize에서 게시한다.
# (electron-builder의 GitHub publish는 이미 게시된 릴리스에는 에셋을 올리지 않고 조용히 건너뛴다.)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "RIFTLINE ${{ steps.bump.outputs.tag }}" \
            --generate-notes \
            --draft

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - run: npm run build:electron
        shell: bash

      - name: Publish exe to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
        shell: bash

  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - run: npm run build

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      # cap sync (copy+update 결합)는 이 Linux 러너에서 즉시 실패한다 — 원인 불명이지만
      # copy와 update를 분리해서 호출하면 정상 동작한다.
      - name: cap copy android
        run: npx cap copy android

      - name: cap update android
        run: npx cap update android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            "android/app/build/outputs/apk/debug/app-debug.apk#RIFTLINE-${{ needs.version.outputs.tag }}.apk" \
            --clobber

  finalize:
    needs: [version, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --draft=false --repo anaf-4/RIFTLINE
